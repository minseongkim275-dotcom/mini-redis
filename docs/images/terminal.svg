<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-label="기본 사용 예: SET, GET, TTL, NX 실패, INCR, 없는 키, 알 수 없는 명령 오류" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
<rect x="0" y="0" width="960" height="476" rx="16" fill="#0b1a3a"/>
<circle cx="28" cy="26" r="6" fill="#ff5f57"/><circle cx="48" cy="26" r="6" fill="#febc2e"/><circle cx="68" cy="26" r="6" fill="#28c840"/>
<text x="480" y="31" font-size="12.5" font-weight="600" fill="#8fb0f5" text-anchor="middle">mini-redis — 실제 실행 출력 (응답을 redis-cli 형식으로 풀어 쓴 것)</text>
<line x1="0" y1="50" x2="960" y2="50" stroke="#1c2f5a" stroke-width="1" stroke-linecap="round"/>
<text x="28" y="82" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">SET greeting hello EX 60</tspan></text>
<text x="28" y="103" font-size="14" font-weight="400" fill="#c7d6fb" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">OK</text>
<text x="28" y="124" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">GET greeting</tspan></text>
<text x="28" y="145" font-size="14" font-weight="400" fill="#c7d6fb" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&quot;hello&quot;</text>
<text x="28" y="166" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">TTL greeting</tspan></text>
<text x="28" y="187" font-size="14" font-weight="400" fill="#c7d6fb" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(integer) 60</text>
<text x="28" y="208" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">SET greeting again NX</tspan></text>
<text x="932" y="208" font-size="12.5" font-weight="400" fill="#6f83b3" text-anchor="end"># 이미 있는 키라 NX 실패</text>
<text x="28" y="229" font-size="14" font-weight="400" fill="#8a97b5" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(nil)</text>
<text x="28" y="250" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">INCR visits</tspan></text>
<text x="28" y="271" font-size="14" font-weight="400" fill="#c7d6fb" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(integer) 1</text>
<text x="28" y="292" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">INCR visits</tspan></text>
<text x="28" y="313" font-size="14" font-weight="400" fill="#c7d6fb" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(integer) 2</text>
<text x="28" y="334" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">GET nothing</tspan></text>
<text x="932" y="334" font-size="12.5" font-weight="400" fill="#6f83b3" text-anchor="end"># 없는 키</text>
<text x="28" y="355" font-size="14" font-weight="400" fill="#8a97b5" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(nil)</text>
<text x="28" y="376" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">NOSUCH</tspan></text>
<text x="28" y="397" font-size="14" font-weight="400" fill="#ff9a57" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(error) ERR unknown command 'NOSUCH'</text>
<text x="28" y="418" font-size="14" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace"><tspan fill="#8fb0f5" font-weight="700">mini-redis&gt; </tspan><tspan fill="#ffffff" font-weight="700">INCR greeting</tspan></text>
<text x="932" y="418" font-size="12.5" font-weight="400" fill="#6f83b3" text-anchor="end"># 숫자가 아닌 값</text>
<text x="28" y="439" font-size="14" font-weight="400" fill="#ff9a57" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(error) ERR value is not an integer or out of range</text>
</svg>
