<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img" aria-label="AOF 복구: kill -9 로 죽인 뒤 다시 켜도 값이 복원되고 TTL 이 100 에서 98 로 이어진다" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#022047" flood-opacity="0.10"/></filter></defs>
<rect x="14" y="10" width="932" height="362" rx="18" fill="#ffffff" stroke="#d3dbe6" stroke-width="1" filter="url(#sh)"/>
<rect x="46" y="44" width="5" height="26" rx="2.5" fill="#1f4fd1"/>
<text x="62" y="65" font-size="25" font-weight="800" fill="#0b1a3a" letter-spacing="-0.5">서버가 죽어도 되살아난다</text>
<text x="62" y="91" font-size="13.5" font-weight="400" fill="#4e5968">쓰기 명령을 파일 끝에 덧붙이고(AOF), 다시 켤 때 처음부터 다시 실행한다 · 실제 실행 출력</text>
<rect x="857.2" y="44" width="56.8" height="26" rx="13" fill="#0b1a3a"/>
<text x="885.6" y="61.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">복구</text>
<rect x="46" y="116" width="284" height="232" rx="14" fill="#f3f6fb" stroke="#d3dbe6" stroke-width="1.5"/>
<text x="66" y="146" font-size="14.5" font-weight="800" fill="#0b1a3a">① 죽기 전</text>
<rect x="338" y="116" width="284" height="232" rx="14" fill="#0b1a3a" stroke="#0b1a3a" stroke-width="1.5"/>
<text x="358" y="146" font-size="14.5" font-weight="800" fill="#ffffff">② kill -9 · 파일에 남은 것</text>
<rect x="630" y="116" width="284" height="232" rx="14" fill="#f3f6fb" stroke="#d3dbe6" stroke-width="1.5"/>
<text x="650" y="146" font-size="14.5" font-weight="800" fill="#0b1a3a">③ 2초 뒤 다시 켬</text>
<text x="66" y="174" font-size="12.5" font-weight="700" fill="#0b1a3a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&gt; SET a 1</text>
<text x="66" y="191" font-size="12.5" font-weight="400" fill="#4e5968" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">OK</text>
<text x="66" y="207" font-size="12.5" font-weight="700" fill="#0b1a3a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&gt; SET token abc EX 100</text>
<text x="66" y="224" font-size="12.5" font-weight="400" fill="#4e5968" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">OK</text>
<text x="66" y="240" font-size="12.5" font-weight="700" fill="#0b1a3a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&gt; INCR n</text>
<text x="66" y="257" font-size="12.5" font-weight="400" fill="#4e5968" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(integer) 1</text>
<text x="66" y="273" font-size="12.5" font-weight="700" fill="#0b1a3a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&gt; INCR n</text>
<text x="66" y="290" font-size="12.5" font-weight="400" fill="#4e5968" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(integer) 2</text>
<text x="66" y="306" font-size="12.5" font-weight="700" fill="#0b1a3a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&gt; TTL token</text>
<text x="66" y="323" font-size="12.5" font-weight="400" fill="#4e5968" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(integer) 100</text>
<text x="358" y="176" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">SET a 1</text>
<text x="358" y="202" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">SET token abc</text>
<text x="358" y="220" font-size="12.5" font-weight="800" fill="#ffb37a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">  PXAT 1794900696945</text>
<text x="358" y="246" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">INCR n</text>
<text x="358" y="272" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">INCR n</text>
<text x="358" y="306" font-size="12" font-weight="700" fill="#ffb37a">EX 100 은 절대 시각(PXAT)으로 기록</text>
<text x="358" y="326" font-size="12" font-weight="400" fill="#c7d6fb">그대로 쓰면 재시작 때 100초가 다시 시작</text>
<text x="650" y="174" font-size="12.5" font-weight="700" fill="#0b1a3a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&gt; GET a</text>
<text x="650" y="191" font-size="12.5" font-weight="400" fill="#4e5968" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&quot;1&quot;</text>
<text x="650" y="214" font-size="12.5" font-weight="700" fill="#0b1a3a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&gt; GET n</text>
<text x="650" y="231" font-size="12.5" font-weight="400" fill="#4e5968" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&quot;2&quot;</text>
<text x="650" y="254" font-size="12.5" font-weight="700" fill="#0b1a3a" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">&gt; TTL token</text>
<text x="650" y="271" font-size="12.5" font-weight="800" fill="#e05d00" font-family="'D2Coding', 'JetBrains Mono', Consolas, Menlo, monospace">(integer) 98</text>
<text x="650" y="306" font-size="12" font-weight="800" fill="#e05d00">남은 시간이 이어진다</text>
<text x="650" y="326" font-size="12" font-weight="400" fill="#4e5968">100으로 되돌아가지 않는다</text>
</svg>
