<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-label="네 장면: 1 연결과 파싱, 2 해시 테이블에 저장, 3 만료(지연 삭제와 주기 삭제), 4 AOF로 복구" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
