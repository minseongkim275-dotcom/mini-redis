<text x="280.5" y="120" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="-0.4">저장</text>
<text x="280.5" y="150" font-size="14" font-weight="600" fill="#e4ecff">해시 → 버킷 → 체인</text>
